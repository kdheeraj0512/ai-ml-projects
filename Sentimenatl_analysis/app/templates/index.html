<!DOCTYPE html>
<html>
<head>
    <title>Sentiment Analysis</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            margin-top: 60px;
        }
        .card {
            background: white;
            padding: 25px;
            width: 500px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }
        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            margin-top: 10px;
        }
        button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }
        h2 {
            text-align: center;
        }
        .result {
            margin-top: 15px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>Sentiment Analysis</h2>

        <form method="post" action="/predict">
            <textarea name="text" placeholder="Enter text here..." required>{{ input_text or "" }}</textarea>
            <button type="submit">Analyze Sentiment</button>
        </form>

        {% if prediction %}
        <div class="result">
            Sentiment: {{ prediction }} <br />
            Confidence: {{ confidence }}
        </div>
        {% endif %}
    </div>
</body>
</html>
